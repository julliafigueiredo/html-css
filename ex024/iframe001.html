    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <!--tamanho padrão 300x150-->
    <h1>Testando o uso de um iframe</h1>
    <p>Aprendendo a programar com 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="auto">
            <a href="http://www.cursoemvideo.com" target="_blank"> Curso em Vídeo</a>
        </iframe>
    </p>

    <p>
        O repositorio do Guanabara 
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">

        </iframe>
        é bem legal
    </p>

</html>
